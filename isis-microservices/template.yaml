            TableName: !Ref UsersTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /admin/notifications/send
            Auth:
              Authorizer: CognitoJwtAuthorizer

  ListBlogsFunction:
