  ListMyBenefitsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/functions/benefits/list-my-benefits.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BenefitsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /benefits/me
            Auth:
              Authorizer: CognitoJwtAuthorizer

  GetBenefitDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/functions/benefits/get-benefit-detail.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BenefitsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /benefits/{benefitId}
            Auth:
              Authorizer: CognitoJwtAuthorizer

  AssignBenefitFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/functions/benefits/assign-benefit.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BenefitsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DevicesTable
        - Statement:
            Effect: Allow
            Action:
              - sns:Publish
            Resource: "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /benefits/assign
            Auth:
              Authorizer: CognitoJwtAuthorizer

  ListMyNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/functions/notifications/list-my-notifications.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NotificationsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /notifications/me
            Auth:
              Authorizer: CognitoJwtAuthorizer

  MarkNotificationReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/functions/notifications/mark-notification-read.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /notifications/{notificationId}/read
            Auth:
              Authorizer: CognitoJwtAuthorizer

  RegisterDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/functions/notifications/register-device.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DevicesTable
        - Statement:
            Effect: Allow
            Action:
              - sns:CreatePlatformEndpoint
            Resource: "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /devices/register
            Auth:
              Authorizer: CognitoJwtAuthorizer

  SendBenefitAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/functions/notifications/send-benefit-alert.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BenefitsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DevicesTable
        - Statement:
            Effect: Allow
            Action:
              - sns:Publish
            Resource: "*"

  ProcessBenefitAssignmentStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/functions/notifications/process-benefit-assignment-stream.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BenefitsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DevicesTable
        - Statement:
            Effect: Allow
            Action:
              - sns:Publish
            Resource: "*"
      Events:
        BenefitAssignmentsStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt BenefitsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5

Outputs:
  ApiBaseUrl:
    Description: URL base de HTTP API.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}"
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
  UsersTableName:
    Value: !Ref UsersTable
  BenefitsTableName:
    Value: !Ref BenefitsTable
  NotificationsTableName:
    Value: !Ref NotificationsTable
  DevicesTableName:
    Value: !Ref DevicesTable
  AgendaBucketOutput:
    Value: !Ref AgendaBucket
  AgendaSlotsTableOutput:
    Value: !Ref AgendaSlotsTable
  AppointmentsTableOutput:
    Value: !Ref AppointmentsTable
  AgendaImportsTableOutput:
    Value: !Ref AgendaImportsTable
