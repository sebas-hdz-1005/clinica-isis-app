        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /blogs

  GetBlogDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/functions/blogs/get-blog-detail.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
